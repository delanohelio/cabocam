name: Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Configure native (CMake)
        run: cmake -S windows/native -B build/native -A x64

      - name: Build native (CMake)
        run: cmake --build build/native --config Release

      # plumesign (Impactor CLI, MIT) signs and installs the iOS app with the user's Apple ID.
      - name: Download plumesign
        shell: pwsh
        env:
          PLUMESIGN_VERSION: v2.7.3
          PLUMESIGN_SHA256: 94664749fbbceb9a16bf89583f473dafb9b35c8d058a9d8665dc963b3453c6fc
        run: |
          New-Item -ItemType Directory -Force build/tools | Out-Null
          $url = "https://github.com/claration/impactor/releases/download/$env:PLUMESIGN_VERSION/plumesign-windows-x86_64.exe"
          Invoke-WebRequest -Uri $url -OutFile build/tools/plumesign.exe
          $hash = (Get-FileHash build/tools/plumesign.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:PLUMESIGN_SHA256) { throw "plumesign.exe SHA256 mismatch: $hash" }

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like 'refs/tags/v*') { $v = "${{ github.ref_name }}".Substring(1) }
          else { $v = "0.0.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Publish desktop app
        run: >
          dotnet publish windows/desktop/CaboCam.Desktop.csproj
          -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false
          -p:Version=${{ steps.ver.outputs.version }}
          -o dist/CaboCam

      - name: Assemble package
        shell: pwsh
        run: |
          Copy-Item build/native/bin/Release/*.dll dist/CaboCam/ -Force
          Copy-Item windows/installer/*.ps1 dist/CaboCam/ -Force
          Copy-Item windows/installer/LEIA-ME.txt dist/CaboCam/ -Force
          Get-ChildItem dist/CaboCam | Select-Object Name, Length | Format-Table
          Compress-Archive -Path dist/CaboCam/* -DestinationPath dist/CaboCam-Windows-x64.zip -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc /Q "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$PWD\dist\CaboCam" "/DOutputDir=$PWD\dist" windows\installer\CaboCam.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem dist\CaboCam-Setup-*.exe | Select-Object Name, Length | Format-Table

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CaboCam-Setup
          path: dist/CaboCam-Setup-*.exe
          if-no-files-found: error

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaboCam-Windows-x64
          path: dist/CaboCam/
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CaboCam-Setup-*.exe
            dist/CaboCam-Windows-x64.zip
          generate_release_notes: true
